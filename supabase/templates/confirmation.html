<!doctype html>
<html lang="de">
  <body style="margin:0;padding:24px;background:#f8faf9;font-family:Arial,Helvetica,sans-serif;color:#10201c">
    <table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border:1px solid #d9e3df;border-radius:12px">
      <tr>
        <td style="padding:28px">
          <p style="margin:0 0 16px;font-size:18px;font-weight:bold;color:#0f766e">Standzeit</p>
          <h1 style="margin:0 0 12px;font-size:20px">Willkommen bei Standzeit!</h1>
          <p style="margin:0 0 20px;line-height:1.5">Bitte bestätige deine E-Mail-Adresse, damit wir wissen, dass sie dir gehört. Danach kannst du dich anmelden.</p>
          <p style="margin:0 0 24px">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/konto"
               style="display:inline-block;background:#0f766e;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:8px;font-weight:bold">E-Mail bestätigen</a>
          </p>
          <p style="margin:0;font-size:13px;color:#52635e;line-height:1.5">
            Du hast das nicht angefordert? Dann kannst du diese E-Mail einfach ignorieren.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
